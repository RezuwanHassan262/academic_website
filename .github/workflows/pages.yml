# Publishes the committed webpages/ pages to GitHub Pages. webpages/ is the
# source of truth and is edited by hand; the Jekyll sources are no
# longer built here — `webpages/` is the site, and this deploys the same output
# that `npm start` previews locally and that Vercel serves.
name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Only assembles public/ from the committed webpages/ pages. It must not
      # run scripts/build-static.js: that regenerates webpages/ from the Jekyll
      # sources and would discard anything edited in the HTML directly.
      - name: Build site
        run: node scripts/build-site.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
