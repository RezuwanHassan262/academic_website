      Invited to serve as a paper reviewer by the organising committee. Reviewed submissions focusing
      on AI-driven innovations, contributing to the conference's academic quality and integrity.
    images:
      - src: "ieee_reviewer.PNG"
        alt: "IEEE ICACT 2025 reviewer certificate"
