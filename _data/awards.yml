achievements:
  - role: "IELTS Academic"
    org: "British Council"
    date: "December 2025"
    description: >
      Did a very rushed prep in the final 1.5 days, and honestly couldn't have pulled it off without
      two of my favourite juniors — grateful to
      <a href="https://www.linkedin.com/in/u-mong-sain-chak-b055241a6/" rel="noopener">U Mong Sain Chak</a>
      for the last-minute push when I needed it most, and to
      <a href="https://www.linkedin.com/in/rubayet-sabbir-faruque/" rel="noopener">Rubayet Sabbir Faruque</a>
      for being my mock examiner through all the speaking practice and honest feedback.
    images:
      - src: "ielts_score.jpg"
        alt: "IELTS Academic score report"

  - role: "Runners-up — National AI Hackathon"
    org: "Bangladesh Innovation Conclave"
    date: "May 2025"
    description: >
      Competed with team <strong>AgriBRACUion</strong> in the Agriculture category, presenting
      <a href="/portfolio/agribuddy/">AgriBuddy</a> — an AI-powered agentic support system delivering
      personalised, real-time agricultural guidance to farmers in Bangladesh via a Bangla-language
      chatbot combining a RAG framework, vision models and a modular agent design.
      Teammates: <a href="https://www.linkedin.com/in/tontus/" rel="noopener">MD. Shaleh Islam Tonmoy</a>,
      <a href="https://www.linkedin.com/in/tanmoy-shome/" rel="noopener">Tanmoy Shome</a>,
      <a href="https://www.linkedin.com/in/rawhatur-rabbi-rafin/" rel="noopener">Rawhatur Rabbi</a> and
      <a href="https://www.linkedin.com/in/ruwad-naswan-612673245/" rel="noopener">Ruwad Naswan</a>.
      A big shoutout to <a href="https://scholar.google.com/citations?user=2DhrWFgAAAAJ&amp;hl=en" rel="noopener">Dr. Swakkhar Shatabda</a>
      — this project wouldn't have taken shape without his initial push.
    images:
      - src: "pic_1.jpg"
        alt: "AI Hackathon team photo"
      - src: "ss.PNG"
        alt: "AI Hackathon presentation"
      - src: "ht3.jpg"
        alt: "AI Hackathon award ceremony"
      - src: "ht4.jpg"
        alt: "AI Hackathon team discussion"
      - src: "ht5.jpg"
        alt: "AI Hackathon project demo"
      - src: "ht6.jpg"
        alt: "AI Hackathon final results"

