entries:
  - role: "AI/ML Researcher &amp; Assistant Co-ordinator"
    org: "Bengali.AI"
    date: "Ongoing"
    description: >
      Founded in 2018, Bengali.AI develops open-source AI language tools and technologies for the
      Bengali language — both for everyday users and as resources for deep learning and linguistics
      researchers. It is a non-profit initiative working to close the gap in open-sourced datasets and
      tooling for Bengali computer vision, NLP, speech recognition and computational linguistics, with
      the ultimate aspiration of lifting Bengali out of the low-resource category.
      I work mostly on speech projects and audio data — for example Bengali speech-to-text with regional
      accents and dialects (which I currently lead), indigenous speech-text corpora, and speech-to-IPA
      transcription.
    images:
      - src: "bai1.jpg"
        alt: "Bengali.AI team"
      - src: "bai2.jpg"
        alt: "Bengali.AI team"
      - src: "bai3.jpg"
        alt: "Bengali.AI speech data collection"
      - src: "bai_meetup.jpg"
        alt: "Bengali.AI meetup"

